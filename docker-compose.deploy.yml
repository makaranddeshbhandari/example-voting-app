services:
  vote:
    image: makarand27/voting-app:vote-14
    ports:
      - "8086:80"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - front-tier
      - back-tier
    restart: unless-stopped

  result:
    image: makarand27/voting-app:result-14
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - front-tier
      - back-tier
    restart: unless-stopped

  worker:
    image: makarand27/voting-app:worker-14
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - back-tier
    restart: unless-stopped

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - back-tier
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - back-tier
    restart: unless-stopped

volumes:
  db-data:

networks:
  front-tier:
  back-tier:
